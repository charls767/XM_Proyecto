# Tema según ISA-101 (src/isa101.py): fondo gris neutro, texto gris oscuro y un solo acento sobrio.
[theme]
base = "light"
primaryColor = "#2F4F6F"
backgroundColor = "#E0E0E0"
secondaryBackgroundColor = "#D3D3D3"
textColor = "#1F1F1F"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
